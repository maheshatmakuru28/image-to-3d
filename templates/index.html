<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural 3D Photo Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101828, #243b55);
    color: white;
    min-height: 100vh;
}

.container {
    max-width: 900px;
    margin: auto;
    text-align: center;
}

h1 {
    color: #65e7ff;
    margin-bottom: 8px;
}

.subtitle {
    color: #d5e2f0;
    margin-bottom: 25px;
}

.panel {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
}

.upload {
    display: inline-block;
    background: #00bcd4;
    color: #071923;
    font-weight: bold;
    padding: 13px 22px;
    border-radius: 10px;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

.preview-area {
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 25px 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 12px;
}

#photo {
    display: none;
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 8px;
    transform: perspective(900px) rotateX(0deg) rotateY(0deg) scale(1);
    box-shadow: 0 18px 35px rgba(0,0,0,0.45);
    transition: transform 0.15s ease, filter 0.15s ease,
                box-shadow 0.15s ease;
}

#placeholder {
    color: #bdc9d8;
    line-height: 1.7;
}

.controls {
    text-align: left;
    margin-top: 20px;
}

.control {
    margin: 18px 0;
}

.control label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
    accent-color: #00d5ff;
}

button {
    border: none;
    padding: 13px 18px;
    border-radius: 10px;
    margin: 7px 4px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.apply {
    background: #00d5a0;
    color: #06281f;
}

.download {
    background: #65e7ff;
    color: #06212b;
}

.reset {
    background: #e1e8f0;
    color: #17212b;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

#status {
    color: #a9f7d8;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

footer {
    color: #b8c6d8;
    font-size: 13px;
    margin: 25px 0 10px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .panel {
        padding: 14px;
    }

    h1 {
        font-size: 25px;
    }

    #photo {
        max-height: 350px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>🌟 Natural 3D Photo Studio</h1>
    <p class="subtitle">
        Upload your photo, adjust the natural depth-style effect, and download.
    </p>

    <div class="panel">
        <label class="upload" for="imageInput">
            📷 Upload Your Photo
        </label>
        <input type="file" id="imageInput" accept="image/*">

        <p id="status" role="status">Choose a photo to get started.</p>
    </div>

    <div class="panel">
        <h2>Photo Preview</h2>
