<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Natural 3D Photo Converter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #080d19;
    color: white;
}

.container {
    max-width: 850px;
    margin: auto;
}

header {
    text-align: center;
    padding: 20px 0;
}

h1 {
    font-size: clamp(28px, 5vw, 42px);
}

h1 span {
    color: #60a5fa;
}

p {
    color: #b6c5dc;
    line-height: 1.7;
}

.card {
    background: #121c31;
    border: 1px solid #2b3b59;
    border-radius: 18px;
    padding: 22px;
    margin: 20px 0;
}

.upload {
    display: block;
    padding: 30px 15px;
    text-align: center;
    border: 2px dashed #60a5fa;
    border-radius: 14px;
    cursor: pointer;
    background: #0b1426;
}

.upload-icon {
    font-size: 45px;
    margin-bottom: 12px;
}

input[type="file"] {
    display: none;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(100deg, #2563eb, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.secondary {
    background: #263752;
}

.control {
    margin-top: 22px;
}

.control label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.control output {
    color: #60a5fa;
}

input[type="range"] {
    width: 100%;
    accent-color: #60a5fa;
}

.preview {
    min-height: 280px;
    background: radial-gradient(
        circle,
        #263b5b,
        #080d19
    );
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    overflow: hidden;
    perspective: 1000px;
}

#photoPreview {
    display: none;
    max-width: 100%;
    max-height: 450px;
    object-fit: contain;
    border-radius: 8px;
    transform-style: preserve-3d;
    transition: transform 0.15s ease, filter 0.15s ease;
}

.placeholder {
    text-align: center;
    color: #b6c5dc;
}

.status {
    color: #93c5fd;
    margin-top: 15px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.note {
    font-size: 12px;
    color: #b6c5dc;
}
